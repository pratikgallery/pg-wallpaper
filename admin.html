<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060607"><link rel="icon" href="./icon.svg"><title>Admin Studio — PG Wallpaper</title><style>:root{--red:#ff1744}body{margin:0;background:#060607;color:#fff;font-family:Inter,system-ui}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.nav{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center}.nav .shell{display:flex;justify-content:space-between}.btn{padding:10px 14px;border-radius:11px;border:1px solid #ffffff18;background:#ffffff09;color:#fff}.primary{background:linear-gradient(135deg,#ff1744,#a9002b);border:0}.hero{padding:40px 0 25px}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{border:1px solid #ffffff12;border-radius:20px;background:#ffffff06;padding:20px}.field{margin-bottom:13px}.field label{display:block;color:#999;font-size:12px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ffffff16;border-radius:11px;background:#0c0c0e;color:#fff;padding:12px;outline:none}.field textarea{min-height:85px;resize:vertical}.check{display:flex;gap:8px;align-items:center;color:#aaa;font-size:13px;margin:12px 0}.table{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;border:1px solid #ffffff10;border-radius:15px;padding:10px;background:#ffffff04}.item img{width:70px;height:70px;object-fit:cover;border-radius:10px}.item .grow{flex:1}.muted{color:#888;font-size:12px}.danger{color:#ff718b;border-color:#ff174433}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="shell"><strong>PG Admin Studio</strong><a class="btn" href="./">View site</a></div></header><main class="shell"><section class="hero"><h1>Content control</h1><p class="muted">Upload, organize and curate the PG Wallpaper catalog.</p></section><div class="layout"><section class="panel"><h2>Upload wallpaper</h2><form id="upload"><div class="field"><label>Wallpaper image</label><input id="file" type="file" accept="image/*" required></div><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Category</label><input id="category" placeholder="anime" required></div><div class="field"><label>Tags</label><input id="tags" placeholder="dark, red, 4k"></div><div class="field"><label>Device</label><select id="device"><option value="mobile">Mobile</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="all">All devices</option></select></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><label class="check"><input id="featured" type="checkbox"> Featured wallpaper</label><button class="btn primary" id="uploadBtn">Upload wallpaper</button><p id="msg" class="muted"></p></form><hr style="border-color:#ffffff12;border-width:1px 0 0;margin:25px 0"><h2>Category</h2><form id="cat"><div class="field"><label>Name</label><input id="catName" required></div><div class="field"><label>Slug</label><input id="catSlug" required></div><div class="field"><label>Order</label><input id="catOrder" type="number" value="0"></div><button class="btn primary">Create category</button></form></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Catalog</h2><button id="refresh" class="btn">Refresh</button></div><div id="list" class="table"></div></section></div></main><script type="module">import{requireAdmin,uploadWallpaper,deleteWallpaper,listWallpapers,createCategory,listCategories,deleteCategory}from'./js/admin.js';if(await requireAdmin()){const $=s=>document.querySelector(s),list=$('#list');async function render(){const ws=await listWallpapers();const cs=await listCategories();list.innerHTML=(ws.length?ws.map(w=>`<div class="item"><img src="${w.imageUrl||''}"><div class="grow"><b>${w.title||'Untitled'}</b><div class="muted">${w.category||''} · ${w.device||''}</div></div><button class="btn danger" data-del="${w.id}">Delete</button></div>`).join(''):'<p class="muted">No wallpapers yet.</p>')+`<div style="margin-top:20px"><b>Categories</b>${cs.map(c=>`<div class="item" style="margin-top:8px"><div class="grow">${c.name} <span class="muted">${c.slug}</span></div><button class="btn danger" data-cat="${c.id}">Delete</button></div>`).join('')}</div>`}render();$('#refresh').onclick=render;$('#upload').onsubmit=async e=>{e.preventDefault();const b=$('#uploadBtn');b.disabled=true;b.textContent='Uploading…';try{await uploadWallpaper({file:$('#file').files[0],title:$('#title').value,category:$('#category').value,tags:$('#tags').value,device:$('#device').value,description:$('#description').value,featured:$('#featured').checked});$('#msg').textContent='Wallpaper uploaded.';e.target.reset();await render()}catch(x){$('#msg').textContent=x.message}b.disabled=false;b.textContent='Upload wallpaper'};$('#cat').onsubmit=async e=>{e.preventDefault();try{await createCategory($('#catName').value,$('#catSlug').value,$('#catOrder').value);e.target.reset();await render()}catch(x){alert(x.message)}};list.onclick=async e=>{const d=e.target.closest('[data-del]');if(d){const ws=await listWallpapers(),w=ws.find(x=>x.id===d.dataset.del);if(w&&confirm('Delete this wallpaper?')){await deleteWallpaper(w);await render()}}const c=e.target.closest('[data-cat]');if(c&&confirm('Delete category?')){await deleteCategory(c.dataset.cat);await render()}}}</script></body></html>
