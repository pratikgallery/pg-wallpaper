<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060607"><link rel="icon" href="./icon.svg"><title>Login — PG Wallpaper</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#ff174426,transparent 35%),#060607;color:#fff;font-family:Inter,system-ui}.card{width:min(430px,100%);padding:32px;border:1px solid #ffffff1c;border-radius:28px;background:#ffffff09;backdrop-filter:blur(25px);box-shadow:0 30px 90px #0008}.logo{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#ff1744,#70001d);font-weight:950;margin-bottom:24px}h1{font-size:32px;margin:0;letter-spacing:-1.5px}.sub{color:#999;line-height:1.6;font-size:14px;margin:8px 0 28px}.field{margin-bottom:16px}label{display:block;color:#ccc;font-size:13px;margin-bottom:8px}input{width:100%;height:52px;padding:0 15px;border-radius:14px;border:1px solid #ffffff1c;background:#ffffff09;color:white;outline:none}input:focus{border-color:#ff1744aa;box-shadow:0 0 0 4px #ff17441a}.btn{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff1744,#b0002d);color:#fff;font-weight:800}.links{margin-top:20px;text-align:center;color:#888;font-size:13px}.links a{color:#ff4f72;font-weight:700}.msg{min-height:20px;margin-top:14px;color:#ff6b88;font-size:13px}</style></head><body><main class="card"><div class="logo">PG</div><h1>Welcome back</h1><p class="sub">Login to your PG Wallpaper account.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="btn">Login</button><div class="msg" id="msg"></div></form><div class="links"><a href="#" id="forgot">Forgot password?</a><br><br>New here? <a href="./signup.html">Create account</a><br><br><a href="./">← Back to PG Wallpaper</a></div></main><script type="module">import{loginUser,resetPassword}from'./js/auth.js';const $=s=>document.querySelector(s),form=$('#form'),msg=$('#msg'),btn=$('#btn');form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Logging in…';const r=await loginUser($('#email').value,$('#password').value);if(r.success)location.href='./index.html';else{msg.textContent=r.message;btn.disabled=false;btn.textContent='Login'}};$('#forgot').onclick=async e=>{e.preventDefault();const email=$('#email').value;if(!email){msg.textContent='Enter your email first.';return}const r=await resetPassword(email);msg.style.color=r.success?'#65ff9b':'#ff6b88';msg.textContent=r.success?'Password reset email sent.':r.message}</script></body></html>
