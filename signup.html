<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Create Account — PG Wallpaper</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,23,68,.16), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(157,0,38,.13), transparent 30%),
        #050505;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(430px, 100%);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        0 0 50px rgba(255,23,68,.08);
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 17px;
      background: linear-gradient(145deg,#ff1744,#70001d);
      font-weight: 950;
      box-shadow: 0 0 30px rgba(255,23,68,.25);
    }

    h1 {
      font-size: 32px;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: #999;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.055);
      color: #fff;
    }

    input:focus {
      border-color: rgba(255,23,68,.6);
      box-shadow: 0 0 0 4px rgba(255,23,68,.08);
    }

    .button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg,#ff1744,#b0002d);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255,23,68,.18);
    }

    .button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
      color: #ff6b88;
    }

    .bottom {
      margin-top: 24px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    .bottom a {
      color: #ff4f72;
      font-weight: 700;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">PG</div>

    <h1>Create account</h1>

    <p class="subtitle">
      Join PG Wallpaper and save your favorite wallpapers.
    </p>

    <form id="signupForm">

      <div class="field">
        <label for="displayName">Name</label>
        <input
          id="displayName"
          type="text"
          placeholder="Your name"
          autocomplete="name"
          minlength="2"
          maxlength="50"
          required
        >
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Minimum 6 characters"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Enter password again"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <button
        class="button"
        id="signupButton"
        type="submit"
      >
        Create account
      </button>

      <div
        class="message"
        id="message"
        role="alert"
      ></div>

    </form>

    <div class="bottom">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
      ← Back to PG Wallpaper
    </a>

  </main>


  <script type="module">

    import { registerUser } from "./js/auth.js";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const displayName =
        document.getElementById("displayName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.textContent = "";
      message.style.color = "#ff6b88";

      if (displayName.length < 2) {
        message.textContent = "Please enter your name.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 6) {
        message.textContent =
          "Password must contain at least 6 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      const result =
        await registerUser(
          displayName,
          email,
          password
        );

      if (result.success) {

        message.style.color = "#65ff9b";
        message.textContent =
          "Account created successfully.";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 800);

      } else {

        message.textContent = result.message;

        button.disabled = false;
        button.textContent = "Create account";
      }

    });

  </script>

</body>
</html>
