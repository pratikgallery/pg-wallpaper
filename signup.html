<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060607"><link rel="icon" href="./icon.svg"><title>Create Account — PG Wallpaper</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#ff174426,transparent 35%),#060607;color:#fff;font-family:Inter,system-ui}.card{width:min(430px,100%);padding:32px;border:1px solid #ffffff1c;border-radius:28px;background:#ffffff09;backdrop-filter:blur(25px);box-shadow:0 30px 90px #0008}.logo{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#ff1744,#70001d);font-weight:950;margin-bottom:24px}h1{font-size:32px;margin:0;letter-spacing:-1.5px}.sub{color:#999;line-height:1.6;font-size:14px;margin:8px 0 28px}.field{margin-bottom:16px}label{display:block;color:#ccc;font-size:13px;margin-bottom:8px}input{width:100%;height:52px;padding:0 15px;border-radius:14px;border:1px solid #ffffff1c;background:#ffffff09;color:white;outline:none}.btn{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff1744,#b0002d);color:#fff;font-weight:800}.links{margin-top:20px;text-align:center;color:#888;font-size:13px}.links a{color:#ff4f72;font-weight:700}.msg{min-height:20px;margin-top:14px;color:#ff6b88;font-size:13px}</style></head><body><main class="card"><div class="logo">PG</div><h1>Create account</h1><p class="sub">Save favorites and build your personal wallpaper collection.</p><form id="form"><div class="field"><label>Name</label><input id="name" autocomplete="name" required></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div><button class="btn" id="btn">Create account</button><div class="msg" id="msg"></div></form><div class="links">Already have an account? <a href="./login.html">Login</a><br><br><a href="./">← Back to PG Wallpaper</a></div></main><script type="module">import{registerUser}from'./js/auth.js';const $=s=>document.querySelector(s),form=$('#form'),btn=$('#btn'),msg=$('#msg');form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Creating…';const r=await registerUser($('#name').value,$('#email').value,$('#password').value);if(r.success){msg.style.color='#65ff9b';msg.textContent='Account created. Redirecting…';setTimeout(()=>location.href='./index.html',500)}else{msg.textContent=r.message;btn.disabled=false;btn.textContent='Create account'}}</script></body></html>
