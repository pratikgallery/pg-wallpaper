<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060607"><link rel="icon" href="./icon.svg"><title>Account — PG Wallpaper</title><style>body{margin:0;background:#060607;color:#fff;font-family:Inter,system-ui}.shell{width:min(1000px,calc(100% - 28px));margin:auto}.nav{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850}.btn{padding:10px 14px;border:1px solid #ffffff15;border-radius:12px;background:#ffffff09;color:white}.danger{border-color:#ff174455;color:#ff6b88}.hero{padding:55px 0 35px}.panel{padding:25px;border:1px solid #ffffff12;border-radius:22px;background:#ffffff06}.muted{color:#8b8b92}.form{display:flex;gap:10px;margin-top:18px}.form input{flex:1;height:48px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff08;color:white;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.wall{border:1px solid #ffffff12;border-radius:16px;overflow:hidden;background:#0b0b0d}.wall img{width:100%;height:220px;object-fit:cover;display:block}.wall div{padding:12px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.form{flex-direction:column}}</style></head><body><header class="nav"><div class="shell"><a href="./">PG Wallpaper</a></div><div class="shell" style="text-align:right"><button id="logout" class="btn danger">Logout</button></div></header><main class="shell"><section class="hero"><div class="panel"><div class="muted">YOUR ACCOUNT</div><h1 id="name">Loading…</h1><p id="email" class="muted"></p><div class="form"><input id="newName" placeholder="Update display name"><button id="save" class="btn">Save name</button></div><p id="msg" class="muted"></p></div></section><section><h2>Saved favorites</h2><div class="grid" id="grid"></div></section></main><script type="module">import{watchAuthState,getUserProfile,updateUserName,logoutUser,isAdmin}from'./js/auth.js';import{getFavorites}from'./js/favorites.js';const $=s=>document.querySelector(s);watchAuthState(async u=>{if(!u){location.href='./login.html';return}const p=await getUserProfile();$('#name').textContent=p?.displayName||u.displayName||'PG User';$('#email').textContent=u.email;$('#newName').value=p?.displayName||u.displayName||'';if(await isAdmin())document.querySelector('.nav').insertAdjacentHTML('afterbegin','<div class="shell"><a href="./admin.html" class="btn">Admin</a></div>');render()});async function render(){const f=await getFavorites();$('#grid').innerHTML=f.length?f.map(w=>`<article class="wall"><img loading="lazy" src="${w.imageUrl||w.image}" alt=""><div>${w.title||'Wallpaper'}</div></article>`).join(''):'<p class="muted">No favorites yet. Save wallpapers from the home page.</p>'}$('#save').onclick=async()=>{const r=await updateUserName($('#newName').value);$('#msg').textContent=r.success?'Name updated.':r.message;if(r.success)$('#name').textContent=$('#newName').value.trim()};$('#logout').onclick=async()=>{if(confirm('Log out of PG Wallpaper?'))await logoutUser();}</script></body></html>
