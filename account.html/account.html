<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#050505"
>

<title>My Account — PG Wallpaper</title>


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(255,23,68,.16),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(157,0,38,.12),
      transparent 28%
    ),
    #050505;

  color:white;

  font-family:
    Inter,
    system-ui,
    sans-serif;

}

a{

  color:inherit;

  text-decoration:none;

}

.container{

  width:
    min(
      1100px,
      calc(100% - 28px)
    );

  margin:auto;

}

.navbar{

  position:sticky;

  top:0;

  z-index:100;

  padding:14px 0;

  background:
    rgba(5,5,5,.75);

  backdrop-filter:
    blur(24px);

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

}

.nav{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.brand{

  display:flex;

  align-items:center;

  gap:10px;

  font-weight:900;

}

.logo{

  width:38px;
  height:38px;

  display:grid;

  place-items:center;

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #ff1744,
      #70001d
    );

  font-weight:950;

}

.back{

  color:#aaa;

  font-size:14px;

}

main{

  padding:55px 0 80px;

}

.profile{

  padding:30px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:26px;

  background:
    rgba(255,255,255,.055);

  backdrop-filter:
    blur(25px);

}

.profile-top{

  display:flex;

  align-items:center;

  gap:20px;

}

.avatar{

  width:75px;
  height:75px;

  display:grid;

  place-items:center;

  flex-shrink:0;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #ff1744,
      #75001f
    );

  font-size:27px;

  font-weight:950;

  box-shadow:
    0 0 35px
    rgba(255,23,68,.2);

}

.profile-info h1{

  font-size:30px;

  letter-spacing:-1px;

}

.profile-info p{

  margin-top:6px;

  color:#888;

  font-size:14px;

}

.actions{

  display:flex;

  gap:10px;

  margin-top:25px;

}

.action{

  border:
    1px solid
    rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.05);

  color:white;

  padding:
    11px 16px;

  border-radius:12px;

  cursor:pointer;

}

.action.red{

  border-color:
    rgba(255,23,68,.3);

  color:#ff5c7a;

}

.section{

  margin-top:45px;

}

.section-head{

  display:flex;

  justify-content:space-between;

  align-items:end;

  margin-bottom:20px;

}

.section-head h2{

  font-size:27px;

}

.section-head p{

  color:#888;

  margin-top:5px;

  font-size:13px;

}

.grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:15px;

}

.card{

  position:relative;

  min-height:300px;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:20px;

  background:
    rgba(255,255,255,.04);

}

.card-image{

  position:absolute;

  inset:0;

  background-size:cover;

  background-position:center;

}

.card-overlay{

  position:absolute;

  inset:0;

  display:flex;

  flex-direction:column;

  justify-content:end;

  padding:17px;

  background:
    linear-gradient(
      transparent 30%,
      rgba(0,0,0,.9)
    );

}

.card-title{

  font-weight:800;

}

.card-meta{

  margin-top:4px;

  color:#999;

  font-size:12px;

}

.remove{

  position:absolute;

  top:10px;

  right:10px;

  width:36px;
  height:36px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.12);

  background:
    rgba(0,0,0,.45);

  color:#ff5c7a;

  cursor:pointer;

  z-index:5;

}

.empty{

  padding:50px 20px;

  text-align:center;

  border:
    1px dashed
    rgba(255,255,255,.1);

  border-radius:20px;

  color:#777;

}

footer{

  padding:40px 0;

  border-top:
    1px solid
    rgba(255,255,255,.06);

  color:#666;

  text-align:center;

  font-size:13px;

}

@media(max-width:800px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);

  }

}

@media(max-width:550px){

  .profile{

    padding:22px;

  }

  .profile-top{

    align-items:flex-start;

  }

  .profile-info h1{

    font-size:23px;

  }

  .grid{

    grid-template-columns:
      repeat(2,1fr);

  }

  .card{

    min-height:270px;

  }

}

</style>

</head>


<body>


<header class="navbar">

<div class="container nav">

<a
  href="index.html"
  class="brand"
>

<span class="logo">
PG
</span>

<span>
PG Wallpaper
</span>

</a>


<a
  href="index.html"
  class="back"
>
← Home
</a>

</div>

</header>


<main>

<div class="container">


<section class="profile">


<div class="profile-top">


<div
  class="avatar"
  id="avatar"
>
PG
</div>


<div class="profile-info">

<h1 id="name">
Loading...
</h1>

<p id="email">
Loading...
</p>

</div>


</div>


<div class="actions">

<button
  class="action"
  id="editButton"
>
Edit Name
</button>


<button
  class="action red"
  id="logoutButton"
>
Logout
</button>

</div>


</section>


<section class="section">


<div class="section-head">

<div>

<h2>
My Favorites
</h2>

<p>
Your saved PG wallpapers.
</p>

</div>

</div>


<div
  id="favoritesGrid"
  class="grid"
></div>


<div
  id="emptyState"
  class="empty"
  style="display:none"
>

<h3>
No favorites yet.
</h3>

<p style="margin-top:8px;">
Open a wallpaper and tap ♡ to save it.
</p>

</div>


</section>


</div>

</main>


<footer>

<div class="container">

© 2026
<strong>
PG Wallpaper
</strong>

</div>

</footer>


<script type="module">

import {
  watchAuthState,
  logoutUser,
  updateUserProfile
} from "./js/auth.js";

import {
  getFavorites,
  removeFavorite
} from "./js/favorites.js";


const nameElement =
  document.getElementById(
    "name"
  );

const emailElement =
  document.getElementById(
    "email"
  );

const avatar =
  document.getElementById(
    "avatar"
  );

const grid =
  document.getElementById(
    "favoritesGrid"
  );

const empty =
  document.getElementById(
    "emptyState"
  );


/* ==================================================
   AUTH
================================================== */

watchAuthState(
  async user => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    const name =
      user.displayName?.trim()
      ||
      user.email
        ?.split("@")[0]
      ||
      "Account";


    nameElement.textContent =
      name;

    emailElement.textContent =
      user.email || "";


    avatar.textContent =
      name
        .charAt(0)
        .toUpperCase();


    await loadFavorites();

  }
);


/* ==================================================
   FAVORITES
================================================== */

async function loadFavorites(){

  const favorites =
    await getFavorites();


  grid.innerHTML = "";


  if (!favorites.length){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  favorites.forEach(
    wallpaper => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "card";


      const image =
        wallpaper.image ||
        wallpaper.imageUrl ||
        "";


      card.innerHTML = `

        <div
          class="card-image"
          style="
            background-image:
            url('${escapeHtml(image)}')
          "
        ></div>

        <button
          class="remove"
          title="Remove favorite"
        >
          ♥
        </button>

        <div class="card-overlay">

          <div class="card-title">
            ${escapeHtml(
              wallpaper.title ||
              "Wallpaper"
            )}
          </div>

          <div class="card-meta">
            ${escapeHtml(
              wallpaper.category ||
              "Premium"
            )}
            •
            ${escapeHtml(
              wallpaper.resolution ||
              "4K"
            )}
          </div>

        </div>
      `;


      card
        .querySelector(".remove")
        .addEventListener(
          "click",
          async () => {

            const result =
              await removeFavorite(
                wallpaper.id
              );


            if (result.success){

              await loadFavorites();

            }

          }
        );


      grid.appendChild(card);

    }
  );

}


/* ==================================================
   EDIT NAME
================================================== */

document
  .getElementById(
    "editButton"
  )
  .addEventListener(
    "click",
    async () => {

      const current =
        nameElement.textContent;


      const newName =
        prompt(
          "Enter your name:",
          current
        );


      if (
        !newName ||
        !newName.trim()
      ){

        return;

      }


      const result =
        await updateUserProfile(
          newName.trim()
        );


      if (result.success){

        nameElement.textContent =
          newName.trim();

        avatar.textContent =
          newName
            .trim()
            .charAt(0)
            .toUpperCase();

        alert(
          "Profile updated."
        );

      } else {

        alert(
          result.message
        );

      }

    }
  );


/* ==================================================
   LOGOUT
================================================== */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      const result =
        await logoutUser();


      if (result.success){

        window.location.href =
          "index.html";

      } else {

        alert(
          result.message
        );

      }

    }
  );


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>

</html>
